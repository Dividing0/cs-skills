[project]
name = "computer-science-skills-38"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yehor Smoliakov", email = "yehors@ukr.net" }
]
requires-python = ">=3.14"
dependencies = [
    "ruff>=0.17.0",
]

[tool.pyright]
include = ["**/*.py"]
exclude = ["**/.venv", "**/venv", "**/__pycache__", "build", "dist"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false
useLibraryCodeForTypes = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
